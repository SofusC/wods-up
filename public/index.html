<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wod's Up</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Anton&display=swap');

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1e1e2f, #2d2d44);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
      text-align: center;
    }

    h1.logo {
      font-family: 'Anton', sans-serif;
      font-size: 4rem;
      background: linear-gradient(90deg, #ffcc00, #ff6a00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.6);
      margin-bottom: 15px;
    }

    select, button {
      padding: 12px 20px;
      margin: 10px;
      font-size: 1.1rem;
      border-radius: 10px;
      border: none;
      outline: none;
    }

    select {
      background: #2d2d44;
      color: #ffcc00;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    select:hover {
      transform: scale(1.05);
      background: #3a3a5a;
    }

    button {
      background: #ffcc00;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.2s ease;
    }
    button:hover { transform: scale(1.05); }

    #cards-container, #favorites-container {
      margin-top: 30px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 1200px;
    }

    .card {
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 20px;
      text-align: left;
      animation: fadeIn 0.5s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card h2 {
      margin-top: 0;
      font-size: 1.4rem;
    }

    .card p {
      margin: 5px 0;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>

  <script>
    async function getRandomWorkout() {
      let category = document.getElementById("category").value;
      let url = '/api/workouts/random';
      if (category) {
        url += `?category=${encodeURIComponent(category)}`;
      }

      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error('Network response was not ok');
        const data = await res.json();
        addWorkoutCard(data, 'cards-container');
      } catch (err) {
        console.error('Failed to fetch workout:', err);
      }
    }

    function addWorkoutCard(data, containerId) {
      const container = document.getElementById(containerId);
      const card = document.createElement('div');
      card.className = 'card';

      const title = document.createElement('h2');
      title.textContent = `${data.title}`;// (${data.difficulty})`;
      card.appendChild(title);

      data.workout.forEach(line => {
        const p = document.createElement('p');
        p.textContent = line;
        card.appendChild(p);
      });

      const favButton = document.createElement('button');
      favButton.textContent = '⭐ Favorite';
      favButton.style.marginTop = '10px';
      favButton.style.background = '#ffcc00';
      favButton.style.padding = '10px 18px';
      favButton.style.border = 'none';
      favButton.style.borderRadius = '10px';
      favButton.style.fontWeight = 'bold';
      favButton.style.cursor = 'pointer';
      favButton.onclick = () => saveFavorite(data);
      card.appendChild(favButton);

      container.prepend(card);
    }

    function saveFavorite(data) {
      let favs = JSON.parse(localStorage.getItem("favorites") || "[]");
      if (!favs.some(w => w.title === data.title)) {
        favs.push(data);
        localStorage.setItem("favorites", JSON.stringify(favs));
        loadFavorites();
      }
    }

    function loadFavorites() {
      const favs = JSON.parse(localStorage.getItem("favorites") || "[]");
      const container = document.getElementById('favorites-container');
      container.innerHTML = '';
      favs.forEach(data => addWorkoutCard(data, 'favorites-container'));
    }

    window.onload = () => {
      loadFavorites();
    };
  </script>
</head>

<body>
  <h1 class="logo">Wod's Up</h1>

  <select id="category">
    <option value="">All Categories</option>
    <option>Strength</option>
    <option>Cardio</option>
    <option>Hero WODs</option>
  </select>

  <button onclick="getRandomWorkout()">Generate Workout</button>

  <h2>Generated Workouts</h2>
  <div id="cards-container"><!-- generated workout cards appear here --></div>

  <h2>Favorites</h2>
  <div id="favorites-container"><!-- favorite workout cards appear here --></div>

</body>
</html>
